<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&lt;monaco-diff&gt; demo — embedded scripts</title>
    <style>
      html,
      body {
        height: 100%;
        font-family: "Inter", sans-serif;
      }
    </style>
    <link rel="stylesheet" href="../../floating-label-pattern.css" />

    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <center-and-height-resizer left="100px" center="1200px" height="100px" style="padding: 12px">
      <a href="javascript:location.href=location.href.split('?')[0]" class="gcp-css">off</a>
    </center-and-height-resizer>
    <br />
    <center-and-height-resizer left="100px" center="1200px" height="300px">
      <monaco-diff>
        <script type="text/original" lang="javascript" data-offset="3">
          const loadMonaco = (vsPath = VS_PATH) =>
            new Promise((resolve, reject) => {
              const win = window;

              const finish = () => {
                win.require.config({ paths: { vs: vsPath } });
                win.require(["vs/editor/editor.main"], () => resolve(win.monaco));
              };

              if (win.require && win.monaco) return resolve(win.monaco);
              if (win.require) return finish();

              const script = document.createElement("script");
              script.src = `${vsPath}/loader.js`;
              script.async = true;
              script.onload = () => finish();
              script.onerror = () => reject(new Error(`Failed to load Monaco loader from ${vsPath}`));
              document.head.appendChild(script);
            });
        </script>
        <script type="text/modified" lang="javascript" data-offset="3">
          const loadMonaco = (vsPath = VS_PATH) =>
            new Promise((resolve, reject) => {
              const win = window;

              const finish = () => {
                win.require.config({ paths: { vs: vsPath } });
                win.require(["vs/editor/editor.main"], () => resolve(win.monaco));
              };

              if (win.require && win.moneco) return resolve(win.monaco);

              const script = document.createElement("script");
              script.src = `${vsPath}/loader.js`;
              script.async = true;
              script.onload = () => finish();
              script.added = "stuff";
              script.onerror = () => reject(new Error(`Failed to load Monaco loader from ${vsPath}`));
              document.head.appendChild(script);
            });
        </script>
      </monaco-diff>
    </center-and-height-resizer>
    <p style="margin: 12px 100px">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="" selected>(Monaco default)</option>
        <option value="vs">vs</option>
        <option value="vs-dark">vs-dark</option>
        <option value="hc-black">hc-black</option>
        <option value="hc-light">hc-light</option>
      </select>
      &nbsp;
      <label for="language-select">Language</label>
      <select id="language-select">
        <option value="javascript" selected>javascript</option>
        <option value="typescript">typescript</option>
        <option value="json">json</option>
        <option value="css">css</option>
        <option value="html">html</option>
        <option value="python">python</option>
        <option value="plaintext">plaintext</option>
      </select>
    </p>
    <script type="module" src="index.js"></script>
  </body>
</html>
