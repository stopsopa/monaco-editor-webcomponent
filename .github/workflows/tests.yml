name: Tests
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Least privilege: every job declares only what it needs (see "permissions:" in each job).
# Secrets are NOT set at workflow level: NPM_TOKEN is passed only to the single step that publishes,
# so no other step (tests, builds, third party actions) can read it.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04 # https://github.com/actions/runner-images#available-images
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Get Node version from .tool-versions
        id: node-version
        run: echo "version=$(grep nodejs .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#push
      # https://docs.github.com/en/actions/learn-github-actions/contexts
      # WARNING: never put ${{ ... }} of event data directly into "run:". The expression is pasted into the
      # shell script before it runs, so a commit message / branch name / PR title containing a quote
      # becomes shell code. Hand the value over through an environment variable instead.
      - name: Debug github.event
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        run: printf '%s\n' "${EVENT_JSON}"

      - name: test before bringing cache
        run: |
          set -x
          pwd
          ls -la
          ls -la node_modules || true

      # - uses: actions/cache/restore@v3 # https://github.com/actions/cache/blob/main/examples.md#node---yarn
      #   id: restore-cache
      #   with:
      #     path: node_modules
      #     key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      # - name: test if cache revived?
      #   run: |
      #     set -x
      #     pwd
      #     ls -la
      #     ls -la node_modules || true

      - name: npm ci
        run: |
          /bin/bash bash/swap-files-v2.sh \
            package.json package.dev.json \
            package-lock.json package-lock.dev.json \
            -- npm ci
          ls -la node_modules/

      - name: vite ci
        run: |
          cd vite-project
          npm ci

      - name: no local dev server urls in published pages
        run: |
          if grep -rnE "0\.0\.0\.0|localhost|127\.0\.0\.1" docs/*.html index.html; then
            echo "${0} error: docs/ or index.html reference a local dev server (see matches above)"
            exit 1
          fi

      - name: build
        run: /bin/bash build.sh

      # after the build: the tests import compiled .js files of their siblings
      - name: unit tests
        run: node --test "web-component/**/*.test.ts"
        env:
          CONCURRENCY: 10 # required by lib/utils.ts for *.parallel.test.ts

      - name: package.json consistency + tarball whitelist
        run: node scripts/check-package.ts

      - name: link
        run: /bin/bash links.sh

      - name: vite build
        run: |
          (cd vite-project && npm run build)

      # - uses: actions/cache/save@v3 # https://github.com/actions/cache/blob/main/caching-strategies.md#reusing-primary-key-from-restore-cache-as-input-to-save-action
      #   with:
      #     path: node_modules
      #     key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      # - name: pulling playwright docker image
      #   run: |
      #     /bin/bash .github/pull-docker-image.sh

      - name: pull playwright docker image
        run: /bin/bash .github/pull-docker-image.sh

      - name: playwright tests
        run: /bin/bash pw.sh -t docker

      #
      # GitHub Pages
      #

      - name: Clean before artifact
        if: github.ref == 'refs/heads/main'
        run: /bin/bash .github/clean_before_github_pages.sh

      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p gh-pages
          rsync -av --exclude='gh-pages' ./ gh-pages/
          pwd
          ls -la gh-pages/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  github-pages:
    if: github.ref == 'refs/heads/main'
    needs: test

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  npm:
    needs: test # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow#defining-prerequisite-jobs
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 4

    permissions:
      contents: write # https://github.com/semantic-release/semantic-release/issues/2469#issuecomment-1158013884
      issues: write # semantic-release comments on released issues / pull requests
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Get Node version from .tool-versions
        id: node-version
        run: echo "version=$(grep nodejs .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install semantic-release
        # it has to be done here beacause otherwise it will crash for node@15 with error>>> error semantic-release@19.0.5: The engine "node" is incompatible with this module. Expected version ">=16 || ^14.17". Got "15.14.0"
        run: |
          /bin/bash bash/swap-files-v2.sh \
            package.json \
            package.dev.json \
            package-lock.json \
            package-lock.dev.json \
            -- npm install semantic-release conventional-changelog-conventionalcommits

      - name: vite ci
        run: |
          cd vite-project
          npm ci

      - name: build
        run: /bin/bash build.sh

      - name: npm pack
        run: npm pack

      # https://github.com/semantic-release/semantic-release/blob/master/docs/recipes/ci-configurations/github-actions.md
      - name: package.json consistency + tarball whitelist
        run: node scripts/check-package.ts

      # the only step that sees the publish token
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided automatically by github itself https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # search in keepassx
        run: |
          set -x
          node node_modules/.bin/semantic-release --debug
