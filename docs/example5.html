<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>composite-monaco-diff - example 5</title>
  </head>
  <body>
    <a href="https://github.com/stopsopa/monaco-editor-webcomponent/tree/main/docs">source</a>
    <center-and-height-resizer left="50px" center="1200px" height="600px" style="padding: 12px">
      <composite-monaco-diff></composite-monaco-diff>
    </center-and-height-resizer>

    <!--
      This page loads the component from this repository (relative url), so it always matches the code next to it.
      On your own site use:
      https://stopsopa.github.io/monaco-editor-webcomponent/web-component/composite-monaco-diff.js
    -->
    <script type="module">
      import { MonacoDiffElement } from "../web-component/composite-monaco-diff.js";
      import { CenterAndHeightResizer } from "../web-component/CenterAndHeightResizer.js";

      await customElements.whenDefined(MonacoDiffElement.tagName);

      await customElements.whenDefined(CenterAndHeightResizer.tagName);

      const diffEl = document.querySelector(MonacoDiffElement.tagName);
      if (!diffEl) {
        throw new Error("docs/example5.html error: Missing <composite-monaco-diff> element");
      }

      const original = `
    const loadMonaco = (vsPath = VS_PATH) =>
      new Promise((resolve, reject) => {
        const win = window;

        const finish = () => {
          win.require.config({ paths: { vs: vsPath } });
          win.require(["vs/editor/editor.main"], () => resolve(win.monaco));
        };

        if (win.require && win.monaco) return resolve(win.monaco);
        if (win.require) return finish();

        const script = document.createElement("script");
        script.src = \`\${vsPath}/loader.js\`;
        script.async = true;
        script.onload = () => finish();
        script.onerror = () => reject(new Error(\`Failed to load Monaco loader from \${vsPath}\`));
        document.head.appendChild(script);
      });
`;

      const modified = `
const loadMonaco = (vsPath = VS_PATH) =>
  new Promise((resolve, reject) => {
    const win = window;

    const finish = () => {
      win.require.config({ paths: { vs: vsPath } });
      win.require(["vs/editor/editor.main"], () => resolve(win.monaco));
    };

    if (win.require && win.moneco) return resolve(win.monaco);

    const script = document.createElement("script");
    script.src = \`\${vsPath}/loader.js\`;
    script.async = true;
    script.onload = () => finish();
    script.added = 'stuff'
    script.onerror = () => reject(new Error(\`Failed to load Monaco loader from \${vsPath}\`));
    document.head.appendChild(script);
  });
`;

      // The properties can be set at any time - before the editor is ready the values are kept.
      diffEl.original = original;
      diffEl.modified = modified;

      // Full access to Monaco when needed:
      const ready = await diffEl.whenReady();
      console.log("modified side has", ready.modified.getLineCount(), "lines");
    </script>
  </body>
</html>
